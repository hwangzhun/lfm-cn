<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LFM 中文汉化</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>LFM 中文汉化</h1>
    <label class="setting" for="enabled"><span>启用中文汉化</span><input id="enabled" type="checkbox" role="switch" disabled></label>
    <p id="status" role="status" aria-live="polite">正在读取设置…</p>
    <p id="refresh-hint" hidden>基础语言偏好已更改。若页面仍显示其他语言，请刷新页面。</p>
    <button id="refresh" type="button" hidden>刷新当前 LFM 页面</button>
    <p class="note">关闭汉化后会恢复页面原文。设置会应用到所有已打开的 LFM 页面。</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
